name: Environment Variables and Secrets

on: workflow_dispatch

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: production

jobs:
  deploy-to-aws:
    runs-on: ubuntu-latest
    name: Deploy to AWS
    env:
      DEPLOYMENT_NAME: my-app-deployment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Print workflow-level variables
        run: |
          echo "AWS Region: ${{ env.AWS_REGION }}"
          echo "Environment: ${{ env.ENVIRONMENT }}"
      
      - name: Access AWS credentials
        run: |
          echo "AWS Access Key ID is configured"
          echo "AWS Secret Key is configured"
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      
      - name: Print job-level variable
        run: echo "Deployment Name:${{ env.DEPLOYMENT_NAME }}"
      
      - name: Use step-level variable
        run: echo "Container Name:$CONTAINER_NAME"
        env:
          CONTAINER_NAME: my-app-container
